[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharpify-gui"
version = "1.0.0"
authors = [
  { name="bh2619-k", email="jgie4927@outlook.com" },
]
description = "A desktop GUI for the Real-ESRGAN image and video upscaler."
readme = "docs/README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: PyQt",
    "Topic :: Multimedia :: Graphics :: Editors"
]
dependencies = [
    "PyQt6>=6.6.0,<7.0.0"
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8", 
    "pytest",
    "requests-mock",
    "pyinstaller"
]

[project.urls]
"Homepage" = "https://github.com/bh2619-k/sharpify-gui"
"Bug Tracker" = "https://github.com/bh2619-k/sharpify-gui/issues"

[tool.setuptools.packages.find]
where = ["src"]
